name: (Tek Seferlik) Eski Dosyaları Temizle

# Bu workflow OTOMATİK ÇALIŞMAZ — yalnızca elle, GitHub Actions sekmesinden
# "Run workflow" ile tetiklenir.
#
# İKİ AYRI TEMİZLİK:
#  1) 20.08.2026 tarihli incelemede cPanel Dosya Yöneticisi'nde GÖRÜLEREK
#     doğrulanmış kalıntı dosyalar (eski testler/, home.html, vb.)
#  2) deploy.yml'nin İLK sürümündeki bir yapılandırma hatası yüzünden
#     kazayla oluşan "public_html/public_html/" adlı YİNELENEN klasör
#     (FTP hesabı zaten /public_html'e kilitliydi, workflow ayrıca
#     "/public_html/" hedeflediği için içeride bir kopya oluştu — gerçek
#     site hiç güncellenmedi, kazayla oluşan bu kopyaya yazıldı)
#
# NOT: FTP hesabı /public_html'e kilitli (chroot) — bağlanınca kök dizin
# ZATEN public_html'in kendisidir, ayrıca "cd public_html" YAPILMAZ.
#
# dosyalar/, data.sqlite, backups/ bu listede YOKTUR ve asla eklenmemelidir.
on:
  workflow_dispatch:
    inputs:
      onayla:
        description: 'Silmeyi onaylamak için tam olarak SIL yazın'
        required: true

jobs:
  temizle:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.onayla == 'SIL' }}
    steps:
      - name: lftp kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Kalıntı dosyaları ve yanlışlıkla oluşan kopya klasörü sil
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'EOF'
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set cmd:fail-exit no
          rm -rf testler
          rm -f _test_import_tf.js
          rm -f home.html
          rm -f layout-styles.css
          rm -f barkod_cozucu.js
          rm -f icon-192.png
          rm -f icon-512.png
          rm -f ARAYUZ_KORUMA.md
          rm -f GUNCELLEME_NOTLARI.md
          rm -f GUVENLIK_DENETIMI.md
          rm -f GUVENLIK_SERTLESTIRME.md
          rm -f KURULUM.md
          rm -f MUHENDISLIK_STANDARDI.md
          rm -f OLCEKLEME_PLANI.md
          rm -f VPS_KURULUM.md
          rm -f YEDEKLEME_KURULUM.md
          rm -rf public_html
          bye
          EOF

      - name: Sonucu doğrula (kalan dosya listesi)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'EOF'
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          ls
          bye
          EOF
